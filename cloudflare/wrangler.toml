name = "vibe-replay"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "vibe-replay.com", custom_domain = true }]

[assets]
directory = "../website/dist"
binding = "ASSETS"
# Run the worker before serving assets so we can intercept the default 307
# trailing-slash redirect from Workers Assets and promote it to a 301 (see
# worker.ts fallback handler). Search engines treat 301 as permanent and pass
# link equity to the canonical URL.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "vibe-replay-db"
database_id = "c117f92e-921c-44b3-888d-547a860ad1d5"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "REPLAY_BUCKET"
bucket_name = "vibe-replay-storage"

[triggers]
crons = ["0 */6 * * *"]
