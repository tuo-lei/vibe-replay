# Generic dispatcher for crons/* scheduled agent tasks.
#
# Each task is defined by crons/<name>/PROMPT.md (frontmatter: name, description,
# schedule, timezone, runner). This workflow ticks hourly, selects the tasks with
# `runner: github-actions` whose schedule is due, and runs each prompt with
# Claude Code. Tasks with `runner: local` are skipped here — they run on a
# personal agent scheduler with access to local data.
#
# Manual runs: Actions tab → "Agent crons" → Run workflow → optional task name.

name: Agent crons

on:
  schedule:
    # Hourly tick (minute 7 avoids the top-of-hour rush). Per-task schedules
    # live in crons/*/PROMPT.md frontmatter; cron_due.py matches them with a
    # 70-minute lookback to absorb scheduler skew.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "Run a single task by name (empty runs all due tasks)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.due.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: due
        run: |
          MATRIX=$(python3 .github/scripts/cron_due.py --task "${{ inputs.task }}")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "due tasks: $MATRIX"

  run:
    needs: select
    if: ${{ needs.select.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Run scheduled task ${{ matrix.task.name }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          timeout_minutes: ${{ matrix.task.timeout_minutes }}
          prompt: |
            You are executing a scheduled task from this repository.
            Follow the task prompt in ${{ matrix.task.prompt }} verbatim — it contains its own goal, procedure, and reporting rules.
