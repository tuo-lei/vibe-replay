name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm --filter @vibe-replay/website check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:cloudflare

  windows-smoke:
    runs-on: windows-latest
    steps:
      # The agent-instructions test intentionally requires the tracked skill
      # entries to remain symlinks. Set this before checkout so Git does not
      # materialize them as ordinary target-text files.
      - name: Enable symlinks before checkout
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website
        run: pnpm --filter @vibe-replay/website check
      - name: Build website
        run: pnpm --filter @vibe-replay/website build
      - name: Test CLI
        run: pnpm --filter vibe-replay test
      - name: Test viewer
        run: pnpm --filter @vibe-replay/viewer test
      - name: Build
        run: pnpm build
      - name: Smoke-test dev launcher
        shell: pwsh
        run: |
          $apiListener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $apiListener.Start()
          $apiPort = $apiListener.LocalEndpoint.Port
          $apiListener.Stop()

          do {
            $viewerListener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
            $viewerListener.Start()
            $viewerPort = $viewerListener.LocalEndpoint.Port
            $viewerListener.Stop()
          } while ($viewerPort -eq $apiPort)

          $env:VIBE_API_PORT = "$apiPort"
          $env:VIBE_VIEWER_PORT = "$viewerPort"
          $env:VIBE_REPLAY_NO_AUTO_OPEN = "1"
          $process = Start-Process `
            -FilePath "node.exe" `
            -ArgumentList @("scripts/dev.mjs", "-d") `
            -WorkingDirectory $PWD.Path `
            -PassThru `
            -NoNewWindow
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                throw "Dev launcher exited with code $($process.ExitCode)"
              }
              try {
                $viewer = Invoke-WebRequest `
                  -UseBasicParsing `
                  -TimeoutSec 2 `
                  "http://127.0.0.1:$env:VIBE_VIEWER_PORT/"
                $api = Invoke-WebRequest `
                  -UseBasicParsing `
                  -TimeoutSec 2 `
                  "http://127.0.0.1:$env:VIBE_API_PORT/api/scan/status"
                if ($viewer.StatusCode -eq 200 -and $api.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The two child servers may still be starting.
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              throw "Dev launcher did not serve the viewer and API within 45 seconds"
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build viewer
        run: pnpm --filter @vibe-replay/viewer build

      - name: Build CLI
        run: |
          node scripts/copy-file.mjs packages/viewer/dist/index.html packages/cli/assets/viewer.html
          pnpm --filter vibe-replay build

      - name: Build website
        run: |
          node scripts/copy-file.mjs packages/viewer/dist/index.html website/public/view/index.html
          pnpm --filter @vibe-replay/website build

      - name: Simulate npm install (catch broken releases before merge)
        run: |
          cd packages/cli
          pnpm pack --pack-destination /tmp/vibe-replay-pack

          # Check for workspace: protocol leaks
          tar xzf /tmp/vibe-replay-pack/*.tgz -C /tmp/vibe-replay-pack
          if grep -q 'workspace:' /tmp/vibe-replay-pack/package/package.json; then
            echo "::error::workspace: protocol reference found in packed package.json"
            cat /tmp/vibe-replay-pack/package/package.json
            exit 1
          fi

          # Verify required files are in the tarball
          for f in package.json dist/index.js assets/viewer.html; do
            if [ ! -f "/tmp/vibe-replay-pack/package/$f" ]; then
              echo "::error::Required file missing from package: $f"
              ls -R /tmp/vibe-replay-pack/package/
              exit 1
            fi
          done

          # Install from tarball in a clean directory (like a real user)
          mkdir -p /tmp/vibe-replay-smoke
          cd /tmp/vibe-replay-smoke
          npm init -y > /dev/null 2>&1
          npm install /tmp/vibe-replay-pack/*.tgz

          # Verify the CLI actually runs
          npx vibe-replay --version
          echo "Publish simulation passed — package installs and runs correctly"

  # e2e runs on Ubuntu only. Windows-specific concerns (path decoding, CRLF,
  # PowerShell-safe build scripts) are covered by the windows-smoke job (unit
  # tests + build). Browser e2e is intentionally NOT run on Windows: the
  # GIF-export path is timing-sensitive and flakes on Windows runners, so adding
  # it would make CI flaky without meaningful extra coverage.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e

  # Non-blocking dependency vulnerability scan. The step swallows pnpm audit's
  # non-zero exit and instead emits a ::warning:: annotation, so high-severity
  # advisories are visible on the PR/commit without showing a red failing check
  # or blocking the merge.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high severity)
        run: |
          if ! pnpm audit --audit-level high | tee audit.log; then
            echo "::warning::High-severity dependency advisories found — see the audit job log and run 'pnpm audit' locally."
          fi
          # Mirror the report into the job summary for an at-a-glance signal.
          {
            echo "### Dependency audit (high severity)"
            echo '```'
            tail -n 20 audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
