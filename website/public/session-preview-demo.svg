<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>
    text { font-family: 'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,'Liberation Mono','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',monospace,sans-serif; }
    @keyframes fadeInOut {
      0% { opacity: 0 }
      2% { opacity: 1 }
      18% { opacity: 1 }
      20% { opacity: 0 }
      100% { opacity: 0 }
    }
    .frame { opacity: 0; }
    .frame-0 { animation: fadeInOut 25s 0s infinite; animation-fill-mode: backwards; }
    .frame-1 { animation: fadeInOut 25s 5s infinite; }
    .frame-2 { animation: fadeInOut 25s 10s infinite; }
    .frame-3 { animation: fadeInOut 25s 15s infinite; }
    .frame-4 { animation: fadeInOut 25s 20s infinite; }
  </style>

  <defs>
    <clipPath id="vr-clip-demo-ses">
      <rect x="0" y="40" width="960" height="460"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="12" fill="#0d1117"/>

  <!-- Header bar -->
  <path d="M0,12 Q0,0 12,0 H948 Q960,0 960,12 V40 H0 Z" fill="#161b22"/>
  <circle cx="24" cy="20" r="5" fill="#ff7b72" opacity="0.9"/>
  <circle cx="42" cy="20" r="5" fill="#d29922" opacity="0.9"/>
  <circle cx="60" cy="20" r="5" fill="#3fb950" opacity="0.9"/>
  <text x="480" y="25" text-anchor="middle" fill="#7d8590" font-size="12" letter-spacing="0.5">vibe-replay</text>

  <!-- Footer bar -->
  <path d="M0,500 H960 V528 Q960,540 948,540 H12 Q0,540 0,528 Z" fill="#161b22"/>
  <line x1="0" y1="500" x2="960" y2="500" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="524" fill="#7d8590" font-size="11">48 min · 4 responses · 10 tools</text>
  <text x="920" y="524" text-anchor="end" fill="#7d8590" font-size="11">vibe-replay</text>

  <!-- Animated content frames (clipped to content area) -->
  <g clip-path="url(#vr-clip-demo-ses)">
  <g class="frame frame-0">
    <rect x="24" y="56" width="912" height="252" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="80" fill="#3fb950" font-size="13" font-weight="700">YOU</text>
    <text x="916" y="80" text-anchor="end" fill="#7d8590" font-size="13">#01</text>
    <text x="44" y="102" fill="#3fb950" font-size="16">Add a searchable session explorer to the dashboard.</text>
    <line x1="44" y1="132" x2="916" y2="132" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="152" fill="#e6edf3" font-size="13" font-weight="700">ASSISTANT</text>
    <rect x="44" y="164" width="106" height="20" rx="4" fill="rgba(88,166,255,0.15)"/>
    <text x="96.9" y="177" text-anchor="middle" fill="#79b8ff" font-size="12">1 responses</text>
    <rect x="156" y="164" width="75" height="20" rx="4" fill="rgba(210,153,34,0.15)"/>
    <text x="193.3" y="177" text-anchor="middle" fill="#d29922" font-size="12">2 tools</text>
    <line x1="241" y1="166" x2="241" y2="182" stroke="#30363d" stroke-width="1"/>
    <text x="251" y="177" fill="#d29922" font-size="12">Read 1 · Grep 1</text>
    <text x="44" y="200" fill="#e6edf3" font-size="15">I found the existing identity and facet helpers. I’ll reuse them so filtering stays</text>
    <text x="44" y="224" fill="#e6edf3" font-size="15">consistent across the Sessions and Replays tabs.</text>
  </g>

  <g class="frame frame-1">
    <rect x="24" y="56" width="912" height="228" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="80" fill="#3fb950" font-size="13" font-weight="700">YOU</text>
    <text x="916" y="80" text-anchor="end" fill="#7d8590" font-size="13">#02</text>
    <text x="44" y="102" fill="#3fb950" font-size="16">Add provider, repository, and tool filters without making the list feel crowded.</text>
    <line x1="44" y1="132" x2="916" y2="132" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="152" fill="#e6edf3" font-size="13" font-weight="700">ASSISTANT</text>
    <rect x="44" y="164" width="106" height="20" rx="4" fill="rgba(88,166,255,0.15)"/>
    <text x="96.9" y="177" text-anchor="middle" fill="#79b8ff" font-size="12">1 responses</text>
    <rect x="156" y="164" width="75" height="20" rx="4" fill="rgba(210,153,34,0.15)"/>
    <text x="193.3" y="177" text-anchor="middle" fill="#d29922" font-size="12">3 tools</text>
    <line x1="241" y1="166" x2="241" y2="182" stroke="#30363d" stroke-width="1"/>
    <text x="251" y="177" fill="#d29922" font-size="12">Edit 2 · Bash (pnpm) 1</text>
    <text x="44" y="200" fill="#e6edf3" font-size="15">The filters are wired into the existing list and the focused viewer tests pass.</text>
  </g>

  <g class="frame frame-2">
    <rect x="24" y="56" width="912" height="252" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="80" fill="#3fb950" font-size="13" font-weight="700">YOU</text>
    <text x="916" y="80" text-anchor="end" fill="#7d8590" font-size="13">#03</text>
    <text x="44" y="102" fill="#3fb950" font-size="16">Show a useful empty state and keep the query shareable.</text>
    <line x1="44" y1="132" x2="916" y2="132" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="152" fill="#e6edf3" font-size="13" font-weight="700">ASSISTANT</text>
    <rect x="44" y="164" width="106" height="20" rx="4" fill="rgba(88,166,255,0.15)"/>
    <text x="96.9" y="177" text-anchor="middle" fill="#79b8ff" font-size="12">1 responses</text>
    <rect x="156" y="164" width="75" height="20" rx="4" fill="rgba(210,153,34,0.15)"/>
    <text x="193.3" y="177" text-anchor="middle" fill="#d29922" font-size="12">3 tools</text>
    <line x1="241" y1="166" x2="241" y2="182" stroke="#30363d" stroke-width="1"/>
    <text x="251" y="177" fill="#d29922" font-size="12">Read 1 · Edit 1 · Bash (pnpm) 1</text>
    <text x="44" y="200" fill="#e6edf3" font-size="15">The URL now preserves the active filters, and the empty state explains how to broaden the</text>
    <text x="44" y="224" fill="#e6edf3" font-size="15">search.</text>
  </g>

  <g class="frame frame-3">
    <rect x="24" y="56" width="912" height="228" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="80" fill="#3fb950" font-size="13" font-weight="700">YOU</text>
    <text x="916" y="80" text-anchor="end" fill="#7d8590" font-size="13">#04</text>
    <text x="44" y="102" fill="#3fb950" font-size="16">Run the final checks and summarize the result.</text>
    <line x1="44" y1="132" x2="916" y2="132" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="152" fill="#e6edf3" font-size="13" font-weight="700">ASSISTANT</text>
    <rect x="44" y="164" width="106" height="20" rx="4" fill="rgba(88,166,255,0.15)"/>
    <text x="96.9" y="177" text-anchor="middle" fill="#79b8ff" font-size="12">1 responses</text>
    <rect x="156" y="164" width="75" height="20" rx="4" fill="rgba(210,153,34,0.15)"/>
    <text x="193.3" y="177" text-anchor="middle" fill="#d29922" font-size="12">2 tools</text>
    <line x1="241" y1="166" x2="241" y2="182" stroke="#30363d" stroke-width="1"/>
    <text x="251" y="177" fill="#d29922" font-size="12">Bash (pnpm) 1 · search 1</text>
    <text x="44" y="200" fill="#e6edf3" font-size="15">All checks passed. The session explorer is ready to review.</text>
  </g>

  <g class="frame frame-4">
    <rect x="24" y="56" width="912" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="76" fill="#79b8ff" font-size="18" font-weight="600">Ship the session explorer</text>
    <rect x="24" y="134" width="912" height="178" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="44" y="152" fill="#b392f0" font-size="16">claude-sonnet-4-5</text>
    <text x="44" y="178" fill="#3fb950" font-size="16">3 files changed · 4 prompts · 48 min</text>
    <text x="44" y="204" fill="#7d8590" font-size="16">4 responses · 10 tools</text>
    <text x="44" y="230" fill="#d29922" font-size="16">Read 2 · Edit 3 · Bash (pnpm) 3 · Grep 1 · search 1</text>
    <text x="44" y="270" fill="#7d8590" font-size="16">vibe-replay</text>
  </g>
  </g>
</svg>