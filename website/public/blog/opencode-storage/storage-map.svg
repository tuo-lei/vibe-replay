<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode local session storage map</title>
  <desc id="desc">OpenCode stores a session in SQLite across session, message, and part tables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset="1" stop-color="#0f1b19"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d8590"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <path d="M0 120H1200" stroke="#30363d" opacity=".5"/>
  <text x="64" y="68" fill="#e6edf3" font-family="Inter,system-ui,sans-serif" font-size="30" font-weight="700">OpenCode local session storage</text>
  <text x="64" y="101" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">A relational conversation, not a transcript folder</text>

  <rect x="64" y="166" width="1072" height="96" rx="16" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/>
  <text x="94" y="207" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">DATABASE</text>
  <text x="94" y="241" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">${OPENCODE_DATA:-~/.local/share/opencode}/opencode.db</text>

  <path d="M600 262V316" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="64" y="340" width="310" height="186" rx="16" fill="#111923" stroke="#3fb950" stroke-opacity=".55"/>
  <text x="94" y="382" fill="#3fb950" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">session</text>
  <text x="94" y="421" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">id · slug · title</text>
  <text x="94" y="448" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">directory · model</text>
  <text x="94" y="475" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">timestamps · cost</text>
  <text x="94" y="505" fill="#7d8590" font-family="Inter,system-ui,sans-serif" font-size="13">one row per conversation</text>

  <path d="M374 432H444" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="444" y="340" width="310" height="186" rx="16" fill="#111923" stroke="#79b8ff" stroke-opacity=".55"/>
  <text x="474" y="382" fill="#79b8ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">message</text>
  <text x="474" y="421" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">role · time · model</text>
  <text x="474" y="448" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">tokens · finish reason</text>
  <text x="474" y="475" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">JSON metadata</text>
  <text x="474" y="505" fill="#7d8590" font-family="Inter,system-ui,sans-serif" font-size="13">user and assistant boundaries</text>

  <path d="M754 432H824" stroke="#7d8590" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="824" y="340" width="312" height="186" rx="16" fill="#111923" stroke="#22d3ee" stroke-opacity=".55"/>
  <text x="854" y="382" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">part</text>
  <text x="854" y="421" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">text · reasoning</text>
  <text x="854" y="448" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">tool · patch · file</text>
  <text x="854" y="475" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">result · compaction</text>
  <text x="854" y="505" fill="#7d8590" font-family="Inter,system-ui,sans-serif" font-size="13">the replay’s actual content</text>

  <rect x="64" y="590" width="1072" height="1" fill="#30363d"/>
  <text x="64" y="625" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">Query shape: session → message → part · compaction parts are not human prompts</text>
  <text x="64" y="660" fill="#7d8590" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">Live databases may also have newer frames in opencode.db-wal</text>
</svg>
